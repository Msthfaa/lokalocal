<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14110F" />
    <title>Halaman Tidak Ditemukan — Lokalocal</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root {
        --malam: #14110F;
        --malam-2: #1E1916;
        --kertas: #F4EBDD;
        --kertas-redup: #C8BCB0;
        --garis: #3A322C;
        --aksen: #E6B14A;
        --aksen-hover: #F0C368;
      }
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background-color: var(--malam);
        color: var(--kertas);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .kartu-404 {
        max-width: 540px;
        width: 100%;
        background-color: var(--malam-2);
        border: 1px dashed var(--aksen);
        border-radius: 24px;
        padding: 2.5rem 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .merek {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--aksen);
        font-weight: 700;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(1.75rem, 4vw, 2.4rem);
        line-height: 1.2;
      }
      p {
        color: var(--kertas-redup);
        font-size: 1rem;
      }
      .arsir {
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--garis);
        background: repeating-linear-gradient(
          -45deg,
          #191412,
          #191412 6px,
          #352C26 6px,
          #352C26 12px
        );
        margin-block: 0.25rem;
      }
      .tombol {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.65rem 1.35rem;
        border-radius: 9999px;
        background-color: var(--aksen);
        color: var(--malam);
        font-weight: 700;
        font-size: 0.9375rem;
        text-decoration: none;
        margin-top: 0.5rem;
      }
      .tombol:hover {
        background-color: var(--aksen-hover);
      }
      .tombol:focus-visible {
        outline: 3px solid var(--kertas);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="kartu-404">
      <div class="merek">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2L22 12L12 22L2 12L12 2Z" stroke="currentColor" stroke-width="2" />
          <path d="M12 7L17 12L12 17L7 12L12 7Z" fill="currentColor" />
        </svg>
        <span>Lokalocal • 404</span>
      </div>
      <h1>Halaman ini belum tercatat di peta kami.</h1>
      <div class="arsir" aria-hidden="true"></div>
      <p>
        Alamat yang kamu tuju tidak ditemukan. Mari kembali ke halaman utama untuk menelusuri peta 38 provinsi dan 493 catatan budaya Nusantara.
      </p>
      <a href="./" class="tombol">Kembali ke Beranda Lokalocal</a>
    </main>
  </body>
</html>
