<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Lokalocal — Berapa banyak budaya Indonesia yang sudah tercatat?">
  <defs>
    <pattern id="pola-tenun-og" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 4L44 24L24 44L4 24Z" fill="none" stroke="#3A322C" stroke-width="1.2" opacity="0.55" />
      <path d="M24 14L34 24L24 34L14 24Z" fill="none" stroke="#E6B14A" stroke-width="1" opacity="0.22" />
      <circle cx="24" cy="24" r="2" fill="#E07A4F" opacity="0.35" />
    </pattern>
    <linearGradient id="grad-latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14110F" />
      <stop offset="60%" stop-color="#1E1916" />
      <stop offset="100%" stop-color="#28211D" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grad-latar)" />
  <rect width="1200" height="630" fill="url(#pola-tenun-og)" />

  <!-- Bingkai Emas Halus -->
  <rect x="36" y="36" width="1128" height="558" rx="20" fill="#14110F" fill-opacity="0.76" stroke="#3A322C" stroke-width="2" />
  <rect x="36" y="36" width="8" height="558" rx="4" fill="#E6B14A" />

  <!-- Merek Lokalocal -->
  <g transform="translate(88, 92)">
    <path d="M18 0L36 18L18 36L0 18Z" fill="none" stroke="#E6B14A" stroke-width="2.5" />
    <path d="M18 9L27 18L18 27L9 18Z" fill="#E6B14A" />
    <text x="52" y="25" fill="#E6B14A" font-family="Georgia, serif" font-size="24" font-weight="700" letter-spacing="2">LOKALOCAL</text>
  </g>

  <!-- Judul Utama -->
  <text x="88" y="210" fill="#F4EBDD" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">
    Berapa banyak budaya Indonesia
  </text>
  <text x="88" y="280" fill="#F4EBDD" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">
    yang sudah tercatat?
  </text>

  <!-- Slogan Inti -->
  <text x="88" y="352" fill="#E6B14A" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600">
    “Budaya Indonesia tidak sedikit. Yang sedikit adalah yang sudah tercatat.”
  </text>

  <!-- Kotak Metrik Ringkas -->
  <g transform="translate(88, 405)">
    <rect x="0" y="0" width="240" height="108" rx="12" fill="#1E1916" stroke="#3A322C" />
    <text x="24" y="52" fill="#E6B14A" font-family="Georgia, serif" font-size="40" font-weight="700">493</text>
    <text x="24" y="82" fill="#C8BCB0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Catatan Unik (dari 544)</text>

    <rect x="260" y="0" width="240" height="108" rx="12" fill="#1E1916" stroke="#3A322C" />
    <text x="284" y="52" fill="#E07A4F" font-family="Georgia, serif" font-size="40" font-weight="700">28 / 38</text>
    <text x="284" y="82" fill="#C8BCB0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Provinsi Tercatat di SPKT</text>

    <rect x="520" y="0" width="280" height="108" rx="12" fill="#1E1916" stroke="#E6B14A" stroke-dasharray="6 4" />
    <text x="544" y="52" fill="#F4EBDD" font-family="Georgia, serif" font-size="40" font-weight="700">10 Provinsi</text>
    <text x="544" y="82" fill="#E6B14A" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Belum Tercatat di SPKT</text>
  </g>

  <!-- Atribusi -->
  <text x="88" y="556" fill="#C8BCB0" font-family="system-ui, sans-serif" font-size="16">
    Data: SPKT – Kementerian Kebudayaan RI (diambil 9 Oktober 2026)
  </text>
</svg>
