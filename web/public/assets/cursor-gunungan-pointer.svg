<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Gradien Emas Bersinar (Active State) -->
    <linearGradient id="gunungan-gold-active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFE885"/>
      <stop offset="60%" stop-color="#FFAE19"/>
      <stop offset="100%" stop-color="#8F4800"/>
    </linearGradient>

    <!-- Gradien Pohon Hayat Menyala -->
    <linearGradient id="pohon-hayat-active" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2"/>
      <stop offset="50%" stop-color="#C27D18"/>
      <stop offset="100%" stop-color="#4E2300"/>
    </linearGradient>

    <!-- Filter Pendaran Emas Menyala (Golden Glow Aura) -->
    <filter id="cursor-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#FFD700" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#cursor-glow)">
    <!-- Kontur Utama Siluet Gunungan Kayon Bersinar -->
    <path d="M 16 1
             C 18.5 5, 21.5 8.5, 24 13
             C 25.8 16.5, 25 19.5, 25.8 23.5
             L 24 25.5 L 18 25.5 L 18 31 L 14 31 L 14 25.5 L 8 25.5 L 6.2 23.5
             C 7 19.5, 6.2 16.5, 8 13
             C 10.5 8.5, 13.5 5, 16 1 Z"
          fill="url(#gunungan-gold-active)"
          stroke="#2A1200"
          stroke-width="1.2"
          stroke-linejoin="round"/>

    <!-- Bingkai Tepi Tatahan Emas Dalam -->
    <path d="M 16 3.5
             C 18 7, 20.2 10, 22.2 13.8
             C 23.5 16.5, 23 19, 23.8 22.5
             L 22.2 24 L 9.8 24
             C 10.6 19, 10.1 16.5, 11.4 13.8
             C 13.4 10, 15.6 7, 16 3.5 Z"
          fill="none"
          stroke="#683400"
          stroke-width="0.7"
          opacity="0.9"/>

    <!-- Sumbu Meru / Batang Pohon Hayat Kalpataru -->
    <path d="M 16 4.8 L 16 24"
          stroke="url(#pohon-hayat-active)"
          stroke-width="1.2"
          stroke-linecap="round"/>

    <!-- Cabang & Daun Pohon Hayat Kiri-Kanan -->
    <path d="M 16 8.5 Q 13 10.5 11.5 13" fill="none" stroke="#522700" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 16 8.5 Q 19 10.5 20.5 13" fill="none" stroke="#522700" stroke-width="0.9" stroke-linecap="round"/>

    <path d="M 16 12.5 Q 12 15 10 17.5" fill="none" stroke="#522700" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 16 12.5 Q 20 15 22 17.5" fill="none" stroke="#522700" stroke-width="0.9" stroke-linecap="round"/>

    <path d="M 16 16.5 Q 12.5 18.5 10.5 21" fill="none" stroke="#522700" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 16 16.5 Q 19.5 18.5 21.5 21" fill="none" stroke="#522700" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Gapura Paduraksa Bawah -->
    <path d="M 13.2 25.5 L 13.2 21.2 Q 16 19.4 18.8 21.2 L 18.8 25.5 Z"
          fill="#3D1800"
          stroke="#FFF2A3"
          stroke-width="0.7"/>
    <line x1="16" y1="20.5" x2="16" y2="25.5" stroke="#FFF2A3" stroke-width="0.6"/>

    <!-- Pendaran Bintang Kilau Puncak (Sparks Hotspot) -->
    <circle cx="16" cy="1.6" r="1.5" fill="#FFFFFF" stroke="#FFAE00" stroke-width="0.5"/>
    <!-- Sinar Salib Kecil Puncak -->
    <line x1="16" y1="-0.4" x2="16" y2="3.6" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="14" y1="1.6" x2="18" y2="1.6" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>
  </g>
</svg>
